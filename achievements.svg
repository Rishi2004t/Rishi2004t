<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="235" viewBox="0 0 1000 235">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#160b2d"/></linearGradient>
 <linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
 <style>
 .m{font-family:Consolas,'Courier New',monospace}.s{font-family:Arial,sans-serif}
 .card{animation:f 4s ease-in-out infinite}@keyframes f{50%{transform:translateY(-4px)}}
 </style>
</defs>
<rect x="2" y="2" width="996" height="231" rx="22" fill="url(#bg)" stroke="url(#a)" stroke-width="2"/>
<text class="s" x="32" y="43" fill="#f1f5f9" font-size="20" font-weight="700">🏆 Developer Achievements</text>
<text class="m" x="32" y="66" fill="#64748b" font-size="11">Milestones that describe the journey — not fabricated GitHub awards</text>

<g class="card" transform="translate(32 91)">
 <rect width="215" height="105" rx="16" fill="#0b1428" stroke="#22d3ee"/>
 <text x="22" y="37" font-size="25">💻</text><text class="s" x="60" y="34" fill="#f1f5f9" font-size="15" font-weight="700">Project Builder</text>
 <text class="m" x="22" y="64" fill="#94a3b8" font-size="10">Build real-world</text><text class="m" x="22" y="81" fill="#94a3b8" font-size="10">software projects</text>
</g>
<g class="card" transform="translate(272 91)" style="animation-delay:.35s">
 <rect width="215" height="105" rx="16" fill="#0b1428" stroke="#818cf8"/>
 <text x="22" y="37" font-size="25">🧠</text><text class="s" x="60" y="34" fill="#f1f5f9" font-size="15" font-weight="700">Problem Solver</text>
 <text class="m" x="22" y="64" fill="#94a3b8" font-size="10">DSA • Java</text><text class="m" x="22" y="81" fill="#94a3b8" font-size="10">logical thinking</text>
</g>
<g class="card" transform="translate(512 91)" style="animation-delay:.7s">
 <rect width="215" height="105" rx="16" fill="#0b1428" stroke="#c084fc"/>
 <text x="22" y="37" font-size="25">🤖</text><text class="s" x="60" y="34" fill="#f1f5f9" font-size="15" font-weight="700">AI Explorer</text>
 <text class="m" x="22" y="64" fill="#94a3b8" font-size="10">ML • GenAI</text><text class="m" x="22" y="81" fill="#94a3b8" font-size="10">intelligent systems</text>
</g>
<g class="card" transform="translate(752 91)" style="animation-delay:1.05s">
 <rect width="215" height="105" rx="16" fill="#0b1428" stroke="#d946ef"/>
 <text x="22" y="37" font-size="25">🚀</text><text class="s" x="60" y="34" fill="#f1f5f9" font-size="15" font-weight="700">Always Building</text>
 <text class="m" x="22" y="64" fill="#94a3b8" font-size="10">Learn • build</text><text class="m" x="22" y="81" fill="#94a3b8" font-size="10">improve • repeat</text>
</g>
</svg>